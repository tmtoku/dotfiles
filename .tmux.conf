# Color
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',*256col*:RGB'
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Prefix: C-g
unbind C-b
set -g prefix C-g
bind C-g send-prefix

# General
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g aggressive-resize on

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Clear screen
bind l send-keys "clear" Enter

# Pane splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Status bar
set -g status-style 'bg=#000000 fg=#a8a8a8'
set -g status-left '#[fg=#268bd2,bold] #S '
set -g status-right '#[fg=#a8a8a8] %H:%M '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#f8fcf8,bold] #I:#W '

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

if-shell "test -f ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
